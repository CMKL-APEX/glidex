// Tenants, their members and role bindings, and admissions to this
// cluster (spec/tenancy.md §14, milestone T0).
syntax = "proto3";

package glidex.tenancy.v1;

import "glidex/api/v1/options.proto";
import "glidex/api/v1/types.proto";
import "google/protobuf/timestamp.proto";

// Tenants of the directory this control plane hosts.
service TenantService {
  // Every tenant for directory readers; otherwise the caller's own.
  rpc ListTenants(ListTenantsRequest) returns (ListTenantsResponse) {
    option (glidex.api.v1.op) = {
      action: "authenticated"
      kind: KIND_READ
      rest: "GET /tenants"
    };
  }
  rpc GetTenant(GetTenantRequest) returns (GetTenantResponse) {
    option (glidex.api.v1.op) = {
      action: "readTenant"
      kind: KIND_READ
      rest: "GET /tenants/{id}"
    };
  }
  rpc CreateTenant(CreateTenantRequest) returns (CreateTenantResponse) {
    option (glidex.api.v1.op) = {
      action: "createTenant"
      kind: KIND_WRITE
      rest: "POST /tenants"
    };
  }
  rpc UpdateTenant(UpdateTenantRequest) returns (UpdateTenantResponse) {
    option (glidex.api.v1.op) = {
      action: "updateTenant"
      kind: KIND_WRITE
      rest: "PATCH /tenants/{id}"
    };
  }
  rpc SuspendTenant(SuspendTenantRequest) returns (SuspendTenantResponse) {
    option (glidex.api.v1.op) = {
      action: "suspendTenant"
      kind: KIND_WRITE
      rest: "POST /tenants/{id}/suspend"
    };
  }
  rpc ResumeTenant(ResumeTenantRequest) returns (ResumeTenantResponse) {
    option (glidex.api.v1.op) = {
      action: "resumeTenant"
      kind: KIND_WRITE
      rest: "POST /tenants/{id}/resume"
    };
  }
  rpc DeleteTenant(DeleteTenantRequest) returns (DeleteTenantResponse) {
    option (glidex.api.v1.op) = {
      action: "deleteTenant"
      kind: KIND_WRITE
      rest: "DELETE /tenants/{id}"
    };
  }
  rpc ListMembers(ListMembersRequest) returns (ListMembersResponse) {
    option (glidex.api.v1.op) = {
      action: "readTenantMembers"
      kind: KIND_READ
      rest: "GET /tenants/{id}/members"
    };
  }
  rpc AddMember(AddMemberRequest) returns (AddMemberResponse) {
    option (glidex.api.v1.op) = {
      action: "manageTenantMembers"
      kind: KIND_WRITE
      rest: "POST /tenants/{id}/members"
    };
  }
  rpc RemoveMember(RemoveMemberRequest) returns (RemoveMemberResponse) {
    option (glidex.api.v1.op) = {
      action: "manageTenantMembers"
      kind: KIND_WRITE
      rest: "DELETE /tenants/{id}/members/{principal}"
    };
  }
  rpc ListBindings(ListBindingsRequest) returns (ListBindingsResponse) {
    option (glidex.api.v1.op) = {
      action: "readTenantBindings"
      kind: KIND_READ
      rest: "GET /tenants/{id}/bindings"
    };
  }
  rpc AddBinding(AddBindingRequest) returns (AddBindingResponse) {
    option (glidex.api.v1.op) = {
      action: "manageTenantBindings"
      kind: KIND_WRITE
      rest: "POST /tenants/{id}/bindings"
    };
  }
  rpc RemoveBinding(RemoveBindingRequest) returns (RemoveBindingResponse) {
    option (glidex.api.v1.op) = {
      action: "manageTenantBindings"
      kind: KIND_WRITE
      rest: "DELETE /tenants/{id}/bindings/{link}"
    };
  }
  // The tenant's pools on this cluster (spec/host-topology.md §9.1a), with
  // what its projects hold of each and what is free in its cluster pool.
  rpc ListDevicePools(ListDevicePoolsRequest) returns (ListDevicePoolsResponse) {
    option (glidex.api.v1.op) = {
      action: "readTenantDevicePools"
      kind: KIND_READ
      rest: "GET /tenants/{id}/device-pools"
    };
  }
  // Replaces the tenant's pools on this cluster with `pools`.
  rpc SetDevicePools(SetDevicePoolsRequest) returns (SetDevicePoolsResponse) {
    option (glidex.api.v1.op) = {
      action: "manageTenantDevicePools"
      kind: KIND_WRITE
      rest: "PUT /tenants/{id}/device-pools"
    };
  }
  // The clusters of other organizations the tenant uses (spec/tenancy.md D65).
  rpc ListTenantClusters(ListTenantClustersRequest) returns (ListTenantClustersResponse) {
    option (glidex.api.v1.op) = {
      action: "readTenantClusters"
      kind: KIND_READ
      rest: "GET /tenants/{id}/clusters"
    };
  }
  // Redeem a cluster's offer (`gxo_…`): this directory and that cluster
  // trust each other for the tenant from then on.
  rpc OptInCluster(OptInClusterRequest) returns (OptInClusterResponse) {
    option (glidex.api.v1.op) = {
      action: "manageTenantClusters"
      kind: KIND_WRITE
      rest: "POST /tenants/{id}/clusters"
    };
  }
  rpc OptOutCluster(OptOutClusterRequest) returns (OptOutClusterResponse) {
    option (glidex.api.v1.op) = {
      action: "manageTenantClusters"
      kind: KIND_WRITE
      rest: "DELETE /tenants/{id}/clusters/{cluster}"
    };
  }
}

// Which tenants this cluster admits, with their caps (D9, D19). Its
// operator's.
service AdmissionService {
  rpc ListAdmissions(ListAdmissionsRequest) returns (ListAdmissionsResponse) {
    option (glidex.api.v1.op) = {
      action: "listAdmissions"
      kind: KIND_READ
      rest: "GET /admissions"
    };
  }
  rpc SetAdmission(SetAdmissionRequest) returns (SetAdmissionResponse) {
    option (glidex.api.v1.op) = {
      action: "manageAdmissions"
      kind: KIND_WRITE
      rest: "PUT /admissions/{tenant}"
    };
  }
  rpc RemoveAdmission(RemoveAdmissionRequest) returns (RemoveAdmissionResponse) {
    option (glidex.api.v1.op) = {
      action: "manageAdmissions"
      kind: KIND_WRITE
      rest: "DELETE /admissions/{tenant}"
    };
  }
  // An admission offered to a tenant of another directory (spec/tenancy.md
  // D64): the token, shown once, lets that directory redeem it.
  rpc OfferAdmission(OfferAdmissionRequest) returns (OfferAdmissionResponse) {
    option (glidex.api.v1.op) = {
      action: "manageAdmissions"
      kind: KIND_WRITE
      rest: "POST /admissions/offers"
    };
  }
  rpc ListOffers(ListOffersRequest) returns (ListOffersResponse) {
    option (glidex.api.v1.op) = {
      action: "listAdmissions"
      kind: KIND_READ
      rest: "GET /admissions/offers"
    };
  }
  rpc RevokeOffer(RevokeOfferRequest) returns (RevokeOfferResponse) {
    option (glidex.api.v1.op) = {
      action: "manageAdmissions"
      kind: KIND_WRITE
      rest: "DELETE /admissions/offers/{id}"
    };
  }
  // The directories of other organizations this cluster trusts (D65).
  rpc ListTrustedDirectories(ListTrustedDirectoriesRequest) returns (ListTrustedDirectoriesResponse) {
    option (glidex.api.v1.op) = {
      action: "listAdmissions"
      kind: KIND_READ
      rest: "GET /admissions/directories"
    };
  }
  // How long a trusted directory's credentials stay good here after its
  // last feed (spec/tenancy.md D13).
  rpc SetTrustedDirectory(SetTrustedDirectoryRequest) returns (SetTrustedDirectoryResponse) {
    option (glidex.api.v1.op) = {
      action: "manageAdmissions"
      kind: KIND_WRITE
      rest: "PATCH /admissions/directories/{id}"
    };
  }
}

// Directories this host serves (spec/tenancy.md D27, D59): the host's
// operator creates and deletes them, and sees only that they exist; what
// is inside one is its own administrators' business.
service DirectoryService {
  rpc ListDirectories(ListDirectoriesRequest) returns (ListDirectoriesResponse) {
    option (glidex.api.v1.op) = {
      action: "listDirectories"
      kind: KIND_READ
      rest: "GET /directories"
    };
  }
  // A directory, its owner tenant, and the invitation for its first
  // administrator, who signs in with a passkey (D60); the link is shown once.
  rpc CreateDirectory(CreateDirectoryRequest) returns (CreateDirectoryResponse) {
    option (glidex.api.v1.op) = {
      action: "manageDirectories"
      kind: KIND_WRITE
      rest: "POST /directories"
    };
  }
  // Only a directory nobody uses yet: no user, connector or project
  // (`409 directory_not_empty`); `local` never.
  rpc DeleteDirectory(DeleteDirectoryRequest) returns (DeleteDirectoryResponse) {
    option (glidex.api.v1.op) = {
      action: "manageDirectories"
      kind: KIND_WRITE
      rest: "DELETE /directories/{id}"
    };
  }
}

message Tenant {
  string id = 1;
  string directory_id = 2 [json_name = "directory_id"];
  string slug = 3;
  string display_name = 4 [json_name = "display_name"];
  optional bool owns_directory = 5 [json_name = "owns_directory"];
  optional bool operator = 6;
  optional bool suspended = 7;
  google.protobuf.Timestamp created_at = 8 [json_name = "created_at"];
  // This cluster's admission of the tenant, if any.
  Admission admission = 9;
  // The tenant operating this cluster (D4): it can't be suspended here
  // nor lose its admission.
  optional bool operates_here = 10 [json_name = "operates_here"];
}

// Limits; an absent field is unlimited.
message Quotas {
  optional uint32 vms = 1;
  optional uint32 vcpus = 2;
  optional uint32 memory_mib = 3 [json_name = "memory_mib"];
  optional uint32 disk_gib = 4 [json_name = "disk_gib"];
  optional uint32 running_vms = 5 [json_name = "running_vms"];
  optional uint32 networks = 6;
  optional uint32 routers = 7;
  optional uint32 external_ips = 8 [json_name = "external_ips"];
  // Devices of each PCI pool, by pool name; a pool not named is unlimited.
  map<string, uint32> devices = 9;
}

enum AdmissionStatus {
  ADMISSION_STATUS_UNSPECIFIED = 0;
  ADMISSION_STATUS_ADMITTED = 1;
  // No new allocations or starts; running resources stay.
  ADMISSION_STATUS_SUSPENDED = 2;
}

message Admission {
  string tenant_id = 1 [json_name = "tenant_id"];
  string directory_id = 2 [json_name = "directory_id"];
  Quotas cap = 3;
  AdmissionStatus status = 4;
  string by = 5;
  google.protobuf.Timestamp at = 6;
  // The tenant's slug and name, for an operator who can't read the
  // directory's tenants.
  string tenant_slug = 7 [json_name = "tenant_slug"];
  string tenant_display_name = 8 [json_name = "tenant_display_name"];
}

// A tenant's share of a cluster device pool, split among its projects.
message TenantDevicePool {
  // Unique in the tenant, and not a cluster pool's name.
  string name = 1;
  // The cluster pool (`pci.pools`) its devices come from; the tenant must
  // be granted it.
  string from = 2;
  // Devices its projects' VMs ask for at once, in all.
  uint32 max = 3;
  // Projects (id or name; answered as ids) that may ask for it.
  repeated string projects = 4;
  // Answers only: devices its projects' VMs ask for now.
  uint32 used = 5;
  // Answers only: free devices of the cluster pool.
  uint32 free = 6;
  // Answers only: the tenant is no longer granted `from`; nothing new is
  // given from it.
  bool ungranted = 7;
  string by = 8;
  google.protobuf.Timestamp at = 9;
}

message ListDevicePoolsRequest {
  string id = 1;
}

message ListDevicePoolsResponse {
  repeated TenantDevicePool pools = 1;
}

message SetDevicePoolsRequest {
  string id = 1;
  repeated TenantDevicePool pools = 2;
}

message SetDevicePoolsResponse {
  repeated TenantDevicePool pools = 1;
}

message Member {
  string tenant_id = 1 [json_name = "tenant_id"];
  glidex.api.v1.EntityRef principal = 2;
  string by = 3;
  google.protobuf.Timestamp at = 4;
  // The user's display name or the team's name, when known.
  string principal_name = 5 [json_name = "principal_name"];
}

// A role link on the tenant (role.tenant-admin, role.tenant-auditor).
message Binding {
  string id = 1;
  string role = 2;
  glidex.api.v1.EntityRef principal = 3;
  string principal_name = 4 [json_name = "principal_name"];
  string created_by = 5 [json_name = "created_by"];
  google.protobuf.Timestamp created_at = 6 [json_name = "created_at"];
}

message ListTenantsRequest {
  optional uint32 page_size = 1 [json_name = "page_size"];
  string page_token = 2 [json_name = "page_token"];
}

message ListTenantsResponse {
  repeated Tenant tenants = 1;
  string next_page_token = 2 [json_name = "next_page_token"];
}

message GetTenantRequest {
  // Id or slug.
  string id = 1;
}

message CreateTenantRequest {
  string slug = 1;
  string display_name = 2 [json_name = "display_name"];
  optional bool operator = 3;
  // Invite the tenant's first administrator (spec/tenancy.md §6.1, §11):
  // role.tenant-admin, through `connector`. The link comes back once.
  FirstAdmin first_admin = 4 [json_name = "first_admin"];
}

message FirstAdmin {
  string email = 1;
  string connector = 2;
  // 1-30; default 7.
  optional uint32 days = 3;
}

message UpdateTenantRequest {
  string id = 1;
  optional string display_name = 2 [json_name = "display_name"];
  optional bool operator = 3;
}

message SuspendTenantRequest {
  string id = 1;
}

message ResumeTenantRequest {
  string id = 1;
}

message DeleteTenantRequest {
  string id = 1;
}

message DeleteTenantResponse {}

message ListMembersRequest {
  string id = 1;
}

message ListMembersResponse {
  repeated Member members = 1;
}

message AddMemberRequest {
  string id = 1;
  glidex.api.v1.EntityRef principal = 2;
}

message RemoveMemberRequest {
  string id = 1;
  // `user:<id>` or `team:<id>`.
  string principal = 2;
}

message RemoveMemberResponse {}

message ListBindingsRequest {
  string id = 1;
}

message ListBindingsResponse {
  repeated Binding bindings = 1;
}

message AddBindingRequest {
  string id = 1;
  string role = 2;
  glidex.api.v1.EntityRef principal = 3;
}

message RemoveBindingRequest {
  string id = 1;
  string link = 2;
}

message RemoveBindingResponse {}

message ListAdmissionsRequest {}

message ListAdmissionsResponse {
  repeated Admission admissions = 1;
}

message SetAdmissionRequest {
  // Tenant id or slug.
  string tenant = 1;
  // Absent: keep the current cap, or unlimited for a new admission.
  Quotas cap = 2;
  optional bool suspended = 3;
}

message RemoveAdmissionRequest {
  string tenant = 1;
}

message RemoveAdmissionResponse {}

message GetTenantResponse {
  Tenant tenant = 1;
}

message CreateTenantResponse {
  Tenant tenant = 1;
  // With `first_admin`: the invitation's link (`…/invite/<id>#<secret>`),
  // shown once.
  optional string invitation_link = 2 [json_name = "invitation_link"];
}

message UpdateTenantResponse {
  Tenant tenant = 1;
}

message SuspendTenantResponse {
  Tenant tenant = 1;
}

message ResumeTenantResponse {
  Tenant tenant = 1;
}

message AddMemberResponse {
  Member member = 1;
}

message AddBindingResponse {
  Binding binding = 1;
}

message SetAdmissionResponse {
  Admission admission = 1;
}

message HostedDirectory {
  // `[a-z0-9-]{1,32}`; its issuer path is `/d/<id>`.
  string id = 1;
  string name = 2;
  // Its issuer URL (D52).
  string issuer = 3;
  google.protobuf.Timestamp created_at = 4 [json_name = "created_at"];
  // Its SPIFFE trust domain (workload-identity.md W13): the one chosen or
  // fixed, else the default it would get, `<id>.<issuer host>`.
  string trust_domain = 5 [json_name = "trust_domain"];
}

message ListDirectoriesRequest {}
message ListDirectoriesResponse {
  repeated HostedDirectory directories = 1;
}

message CreateDirectoryRequest {
  string id = 1;
  string name = 2;
  // The owner tenant's slug (D7).
  string owner = 3;
  // Who is invited as its first administrator (D59).
  string admin_email = 4 [json_name = "admin_email"];
  // How long the invitation lasts, in days (default 7).
  optional uint32 days = 5;
  // Its SPIFFE trust domain, for good (workload-identity.md W13): a name
  // the organization owns. Absent: `<id>.<issuer host>`.
  optional string trust_domain = 6 [json_name = "trust_domain"];
}
message CreateDirectoryResponse {
  HostedDirectory directory = 1;
  // The invitation link, shown once.
  string invitation_link = 2 [json_name = "invitation_link"];
}

message DeleteDirectoryRequest {
  string id = 1;
}
message DeleteDirectoryResponse {}

message Offer {
  string id = 1;
  // The tenant's slug at its directory.
  string tenant = 2;
  // That directory's issuer URL.
  string directory = 3;
  Quotas cap = 4;
  string by = 5;
  google.protobuf.Timestamp created_at = 6 [json_name = "created_at"];
  google.protobuf.Timestamp expires_at = 7 [json_name = "expires_at"];
  google.protobuf.Timestamp redeemed_at = 8 [json_name = "redeemed_at"];
}

message OfferAdmissionRequest {
  string tenant = 1;
  // The directory's issuer URL, `https://…/d/<id>`.
  string directory = 2;
  // Absent: unlimited.
  Quotas cap = 3;
  // Default 7, at most 30.
  optional uint32 days = 4;
}
message OfferAdmissionResponse {
  Offer offer = 1;
  // `gxo_…`, shown once.
  string token = 2;
}

message ListOffersRequest {}
message ListOffersResponse {
  repeated Offer offers = 1;
}

message RevokeOfferRequest {
  string id = 1;
}
message RevokeOfferResponse {}

message TenantCluster {
  string cluster_id = 1 [json_name = "cluster_id"];
  string name = 2;
  // Its API address.
  string api = 3;
  google.protobuf.Timestamp created_at = 4 [json_name = "created_at"];
  // What the cluster last reported of this tenant; absent before its
  // first report.
  TenantClusterReport report = 5;
}

// A cluster's report of one tenant (spec/tenancy.md D70).
message TenantClusterReport {
  // When the directory received it.
  google.protobuf.Timestamp reported_at = 1 [json_name = "reported_at"];
  AdmissionStatus status = 2;
  // The tenant's cap on that cluster.
  Quotas cap = 3;
  uint64 projects = 4;
  uint64 vms = 5;
  uint64 running_vms = 6 [json_name = "running_vms"];
  uint64 disks = 7;
  uint64 disk_gib = 8 [json_name = "disk_gib"];
  uint64 networks = 9;
}

message ListTenantClustersRequest {
  string id = 1;
}
message ListTenantClustersResponse {
  repeated TenantCluster clusters = 1;
}

message OptInClusterRequest {
  string id = 1;
  // The `gxo_…` offer token the cluster's operator sent.
  string offer = 2;
}
message OptInClusterResponse {
  TenantCluster cluster = 1;
}

message OptOutClusterRequest {
  string id = 1;
  string cluster = 2;
}
message OptOutClusterResponse {}

message RemoteTenant {
  string id = 1;
  string slug = 2;
  string display_name = 3 [json_name = "display_name"];
}

message TrustedDirectory {
  string id = 1;
  string issuer = 2;
  repeated RemoteTenant tenants = 3;
  google.protobuf.Timestamp created_at = 4 [json_name = "created_at"];
  // Its own setting; absent: the cluster's default.
  optional uint64 max_staleness_minutes = 5 [json_name = "max_staleness_minutes"];
  // The limit in force.
  uint64 effective_max_staleness_minutes = 6 [json_name = "effective_max_staleness_minutes"];
  // When its feed last answered; absent before the first.
  google.protobuf.Timestamp last_sync = 7 [json_name = "last_sync"];
  // Seconds since then.
  uint64 lag_seconds = 8 [json_name = "lag_seconds"];
  // Past its limit: its credentials are refused here.
  bool stale = 9;
}

message SetTrustedDirectoryRequest {
  // Its `trusted-…` id.
  string id = 1;
  // At least 1; absent: back to the cluster's default
  // (`trust.default_max_staleness_minutes`).
  optional uint64 max_staleness_minutes = 2 [json_name = "max_staleness_minutes"];
}
message SetTrustedDirectoryResponse {
  TrustedDirectory directory = 1;
}

message ListTrustedDirectoriesRequest {}
message ListTrustedDirectoriesResponse {
  repeated TrustedDirectory directories = 1;
}
