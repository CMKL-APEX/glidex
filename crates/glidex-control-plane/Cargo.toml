[package]
name = "glidex-control-plane"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
# WebAuthn (spec/25-passkeys.md): already in the tree through jsonwebtoken.
p256 = { version = "0.13", features = ["ecdsa"] }
ed25519-dalek = "2"
# rsa 0.9 takes sha2 0.10's digests.
sha2_10 = { package = "sha2", version = "0.10" }
rsa = "0.9"
glidex-ovs = { path = "../glidex-ovs" }
glidex-ovn = { path = "../glidex-ovn" }
glidex-netd = { path = "../glidex-netd" }
glidex-stord = { path = "../glidex-stord" }
glidex-hv-client = { path = "../glidex-hv-client" }
glidex-vm-shim = { path = "../glidex-vm-shim" }
zbus = { version = "5", default-features = false, features = ["tokio"] }
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
http = "1"
reqwest = { version = "0.12", features = ["json", "stream"] }
uuid = { version = "1", features = ["v4", "v5"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "1"
tower-http = { version = "0.5", features = ["trace"] }
clap = { version = "4", features = ["derive", "env"] }
rustyline = "15"
colored = "3"
tabled = "0.22"
nix = { version = "0.29", features = ["term", "fs", "process"] }
libc = "0.2"
redb = "3"
smallvec = "1"
dirs = "6"
sha-crypt = "0.6.0"
getrandom = "0.3"
sha2 = "0.11"
ring = "0.17"
futures-util = "0.3"
bytes = "1"
# Unpacking the pinned Debian OVMF package (images/firmware.rs)
tar = { version = "0.4", default-features = false }
lzma-rs = "0.3"
# arm64 kernels wrapped in EFI zboot or gzip (spec/23-kernel-boot.md K8):
# already in the tree through connectrpc.
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
zstd = "0.13"
tempfile = "3"
cedar-policy = "4.13"
arc-swap = "1"
zeroize = { version = "1", features = ["serde"] }
jsonwebtoken = { version = "11", features = ["rust_crypto"] }
base64 = "0.22"
glidex-authd = { path = "../glidex-authd" }
glidex-tls = { path = "../glidex-tls" }
glidex-raftstore = { path = "../glidex-raftstore" }
# Core authentication, shared with hyperstor (spec/11-security.md §5, §7).
glidex-auth = { path = "../glidex-auth" }
# RPC API next to REST (spec/18-grpc.md); pinned with glidex-api's connectrpc.
glidex-api = { path = "../glidex-api" }
# The hyperstor datastore driver (spec/24-storage.md §11.2): hyperstor's
# cluster API client and its certificate helpers, from hyperstor's
# repository, pinned (as hyperstor pins glidex's crates).
hyperstor-api = { git = "https://github.com/CMKL-APEX/hyperstor", rev = "be587343892cdcb16bb74a28cb801e226de92873", features = ["client"] }
hyperstor-pki = { git = "https://github.com/CMKL-APEX/hyperstor", rev = "be587343892cdcb16bb74a28cb801e226de92873" }
connectrpc = { version = "=0.9.1", default-features = false, features = ["json", "gzip", "axum", "client", "client-tls"] }
connectrpc-health = "=0.9.0"
# Server reflection on api.sock (spec/18-grpc.md §3), for grpcurl and buf curl.
connectrpc-reflection = "=0.9.0"
buffa = { version = "=0.9.2", features = ["json"] }
buffa-types = { version = "=0.9.2", features = ["json"] }
hyper = { version = "1", features = ["server", "client", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["server", "server-auto", "tokio", "service"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls-pki-types = { version = "1", features = ["std"] }
tower = { version = "0.5", features = ["util"] }
# gxctl: HTTP over api.sock / TLS
http-body-util = "0.1"
rustls-native-certs = "0.8"
percent-encoding = "2"
url = "2"
# Replicated control plane (spec/14-clustering.md D1); pinned, upgrades reviewed like the CH/OVS pins.
async-trait = "0.1"
openraft = { version = "=0.9.25", features = ["serde", "storage-v2", "generic-snapshot-data"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring", "x509-parser"] }
x509-parser = { version = "0.18", features = ["verify"] }
time = "0.3"

[dev-dependencies]
# The console WebSocket's tests (the browser's console).
tokio-tungstenite = { version = "0.28", default-features = false, features = ["handshake"] }
glidex-api = { path = "../glidex-api", features = ["client"] }
rsa = "0.9"
rand = "0.8"
mime = "0.3"

[[bin]]
name = "gxctl"
path = "src/bin/gxctl/main.rs"

[[bin]]
name = "glidex-control-plane"
path = "src/main.rs"
