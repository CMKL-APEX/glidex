[package]
name = "glidex-control-plane"
version = "0.1.0"
edition = "2021"

[dependencies]
glidex-ovs = { path = "../glidex-ovs" }
glidex-netd = { path = "../glidex-netd" }
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "stream"] }
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "1"
tower-http = { version = "0.5", features = ["trace"] }
clap = { version = "4", features = ["derive", "env"] }
rustyline = "15"
colored = "3"
tabled = "0.17"
nix = { version = "0.29", features = ["term", "fs", "process"] }
libc = "0.2"
redb = "3"
dirs = "6"
sha-crypt = "0.6.0"
getrandom = "0.3"
sha2 = "0.11"
futures-util = "0.3"
tempfile = "3"
cedar-policy = "4.13"
arc-swap = "1"
zeroize = { version = "1", features = ["serde"] }
jsonwebtoken = { version = "11", features = ["rust_crypto"] }
base64 = "0.22"
glidex-authd = { path = "../glidex-authd" }
hyper = { version = "1", features = ["server", "client", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["server", "server-auto", "tokio", "service"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls-pki-types = { version = "1", features = ["std"] }
tower = { version = "0.5", features = ["util"] }
# gxctl: HTTP over api.sock / TLS, console WebSocket
http-body-util = "0.1"
tokio-tungstenite = { version = "0.28", default-features = false, features = ["handshake"] }
rustls-native-certs = "0.8"
percent-encoding = "2"

[dev-dependencies]
rsa = "0.9"
rand = "0.8"
mime = "0.3"

[[bin]]
name = "gxctl"
path = "src/bin/gxctl/main.rs"

[[bin]]
name = "glidex-control-plane"
path = "src/main.rs"
