[package]
name = "glidex-trust"
description = "The cluster side of trust between a cluster and a glidex directory of another organization: offers, peer assertions, the feed, reports and directory tokens, with a fake directory for tests (spec/19-tenancy.md §12, D84)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

# The control plane and hyperstor's management service use it; it keeps
# no records itself (each keeps them in its own store) and needs only
# tokio, hyper's HTTP/1 client and glidex-tls.
[dependencies]
glidex-tls = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { version = "1", features = ["net", "time", "sync", "rt"] }
tracing = { workspace = true }
http = "1"
bytes = "1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls-pki-types = { version = "1", features = ["std"] }
jsonwebtoken = { version = "11", features = ["aws_lc_rs"] }
aws-lc-rs = "1.19"
sha2 = "0.11"
base64 = "0.23"
getrandom = "0.4"
url = "2"

[features]
# `fake::FakeDirectory`: a directory in-process, over HTTPS on loopback,
# for the tests of clusters that trust one.
fake = ["hyper/server", "hyper-util/server", "tokio/macros"]

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
glidex-trust = { path = ".", features = ["fake"] }
