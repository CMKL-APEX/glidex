[package]
name = "glidex-authd"
version.workspace = true
edition.workspace = true
description = "Privileged glidex PAM helper: verifies local users' passwords for the control plane"

[lib]
path = "src/lib.rs"

[[bin]]
name = "glidex-authd"
path = "src/main.rs"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
nix = { version = "0.29", features = ["socket", "user", "fs"] }
libc = "0.2"
libloading = "0.9"
zeroize = "1"

[dev-dependencies]
tempfile = "3"
