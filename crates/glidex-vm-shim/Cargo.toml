[package]
name = "glidex-vm-shim"
version.workspace = true
edition.workspace = true
description = "Per-VM supervisor: parent of the hypervisor, owner of its console (spec/reconciliation.md §8)"

[lib]
path = "src/lib.rs"

[[bin]]
name = "glidex-vm-shim"
path = "src/main.rs"

[dependencies]
glidex-hv-client = { path = "../glidex-hv-client" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
nix = { version = "0.29", features = ["term", "fs", "process", "signal", "socket", "user"] }
libc = "0.2"

[dev-dependencies]
tempfile = "3"
