[package]
name = "glidex-tls"
version.workspace = true
edition.workspace = true

# HTTPS for the control plane and glidex-ui (spec/security.md §5.1):
# listeners on every address, self-signed certificates, and the client
# trust shared by gxctl and the UI.
[dependencies]
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls-pki-types = { version = "1", features = ["std"] }
rustls-native-certs = "0.8"
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
x509-parser = "0.18"
time = "0.3"
sha2 = "0.10"
socket2 = { version = "0.6", features = ["all"] }
nix = { version = "0.29", features = ["net", "hostname", "user", "fs"] }
libc = "0.2"
tokio = { workspace = true }

[dev-dependencies]
tempfile = "3"
