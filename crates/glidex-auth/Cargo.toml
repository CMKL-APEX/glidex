[package]
name = "glidex-auth"
description = "Core authentication for glidex and hyperstor: secrets, session and token rules, a Cedar policy engine and OIDC login (spec/security.md §5, §7)"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
cedar-policy = "4.13"
arc-swap = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tracing = "0.1"
sha2 = "0.11"
getrandom = "0.3"
base64 = "0.22"
zeroize = "1"
jsonwebtoken = { version = "11", features = ["rust_crypto"] }
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["sync"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
