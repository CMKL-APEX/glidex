[package]
name = "glidex-netd"
version.workspace = true
edition.workspace = true
description = "Privileged glidex network helper (Open vSwitch, NAT, VM ports)"

[lib]
path = "src/lib.rs"

[[bin]]
name = "glidex-netd"
path = "src/main.rs"

[dependencies]
glidex-ovs = { path = "../glidex-ovs" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
redb = "3"
nix = { version = "0.29", features = ["socket", "user", "signal", "fs", "process"] }

[dev-dependencies]
tempfile = "3"
