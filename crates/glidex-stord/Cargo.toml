[package]
name = "glidex-stord"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Privileged glidex storage helper (LVM volumes, device access)"

[lib]
path = "src/lib.rs"

[[bin]]
name = "glidex-stord"
path = "src/main.rs"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
nix = { version = "0.29", features = ["socket", "user", "fs"] }

[dev-dependencies]
tempfile = "3"
