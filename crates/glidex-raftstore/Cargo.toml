[package]
name = "glidex-raftstore"
description = "A replicated ReDB store on openraft: write sets recorded from transactions, applied as bytes on every member (spec/14-clustering.md §6)"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
openraft = { version = "=0.9.25", features = ["serde", "storage-v2", "generic-snapshot-data"] }
redb = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smallvec = "1"
base64 = "0.22"
thiserror = "1"
tokio = { version = "1", features = ["full"] }
tempfile = "3"
getrandom = "0.3"
async-trait = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
