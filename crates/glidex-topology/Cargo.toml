[package]
name = "glidex-topology"
description = "A host's topology from sysfs: NUMA nodes and sockets, the PCIe tree with root ports and switches, and network ports with their RDMA devices (spec/22-host-topology.md §3)"
version.workspace = true
edition.workspace = true
license.workspace = true

# Read by glidex's nodes and by hyperstor (its D204), so it depends on
# nothing of glidex's.
[dependencies]
serde = { version = "1", features = ["derive"] }
nix = { version = "0.29", features = ["net"] }

[dev-dependencies]
tempfile = "3"
