name: Docs

# Builds the public book, the internal book and the internal API reference
# (docs/README.md) and keeps them as artifacts. On main, the public site
# (docs/site landing page + the public book under docs/) is published to
# the gh-pages branch. The internal set is never published.
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# The jobs only read the repository; deploy alone writes gh-pages.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  public:

    runs-on: ubuntu-26.04
    timeout-minutes: 10

    steps:
    - uses: actions/checkout@v7
    - uses: taiki-e/install-action@v2
      with:
        tool: mdbook@0.5.4
    - name: Build the public book
      run: mdbook build docs/public
    - name: Assemble the site
      run: |
        mkdir -p target/site
        cp -r docs/site/. target/site/
        cp -r target/docs/public target/site/docs
    - uses: actions/upload-artifact@v4
      with:
        name: docs-public
        path: target/site

  # Publishes the public site to gh-pages, from main only. The branch holds
  # one commit: each deploy replaces it.
  deploy:

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: public
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: gh-pages
      cancel-in-progress: false

    steps:
    - uses: actions/download-artifact@v4
      with:
        name: docs-public
        path: site
    - uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_branch: gh-pages
        publish_dir: site
        force_orphan: true
        commit_message: "Publish docs"

  internal:

    runs-on: ubuntu-26.04
    timeout-minutes: 20

    steps:
    - uses: actions/checkout@v7
    - uses: taiki-e/install-action@v2
      with:
        tool: mdbook@0.5.4
    - name: Build the internal book (spec/)
      run: mdbook build docs/internal
    - name: Build the internal API reference
      # Private items are documented, so links to them are fine here.
      env:
        RUSTDOCFLAGS: -D warnings -A rustdoc::private_intra_doc_links
      run: cargo doc --workspace --no-deps --document-private-items
    - name: Put the API reference under the book
      run: cp -r target/doc target/docs/internal/api
    - uses: actions/upload-artifact@v4
      with:
        name: docs-internal
        path: target/docs/internal
