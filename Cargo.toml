[workspace]
members = [
    "crates/glidex-api",
    "crates/glidex-control-plane",
    "crates/gxctl",
    "crates/glidex-ovs",
    "crates/glidex-ovn",
    "crates/glidex-install",
    "crates/glidex-netd",
    "crates/glidex-stord",
    "crates/glidex-authd",
    "crates/glidex-ui",
    "crates/glidex-hv-client",
    "crates/glidex-vm-shim",
    "crates/glidex-tls",
    "crates/glidex-e2e",
    "crates/glidex-raftstore",
    "crates/glidex-auth",
    "crates/glidex-metad",
    "crates/glidex-topology",
    "crates/glidex",
]
resolver = "2"

[workspace.package]
version = "0.0.8-dev"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/CMKL-APEX/glidex"
homepage = "https://cmkl-apex.github.io/glidex/docs/"

[workspace.dependencies]
# Workspace crates a published crate depends on: crates.io needs a
# version beside the path. It moves with `[workspace.package]` version.
glidex-api = { path = "crates/glidex-api", version = "0.0.8-dev" }
glidex-auth = { path = "crates/glidex-auth", version = "0.0.8-dev" }
glidex-hv-client = { path = "crates/glidex-hv-client", version = "0.0.8-dev" }
glidex-ovn = { path = "crates/glidex-ovn", version = "0.0.8-dev" }
glidex-ovs = { path = "crates/glidex-ovs", version = "0.0.8-dev" }
glidex-raftstore = { path = "crates/glidex-raftstore", version = "0.0.8-dev" }
glidex-tls = { path = "crates/glidex-tls", version = "0.0.8-dev" }
glidex-topology = { path = "crates/glidex-topology", version = "0.0.8-dev" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4", "v5"] }
thiserror = "2"
axum = "0.8"
reqwest = { version = "0.13", features = ["json", "form"] }
tracing = "0.1"
