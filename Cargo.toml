[workspace]
members = [
    "crates/glidex-api",
    "crates/glidex-control-plane",
    "crates/gxctl",
    "crates/glidex-ovs",
    "crates/glidex-ovn",
    "crates/glidex-dpu",
    "crates/glidex-dpu-agent",
    "crates/glidex-install",
    "crates/glidex-netd",
    "crates/glidex-stord",
    "crates/glidex-ui",
    "crates/glidex-hv-client",
    "crates/glidex-vm-shim",
    "crates/glidex-e2e",
    "crates/glidex-metad",
    "crates/glidex",
]
resolver = "2"

[workspace.package]
version = "0.0.10-dev"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/CMKL-APEX/glidex"
homepage = "https://cmkl-apex.github.io/glidex/docs/"

[workspace.dependencies]
# Workspace crates a published crate depends on: crates.io needs a
# version beside the path. It moves with `[workspace.package]` version.
# The libraries shared with hyperstor (glidex-auth, -authd, -raftstore,
# -tls, -topology, -trust) live in glidex-commons, pinned at one release
# tag for all of them (README.md there, "Using it").
glidex-api = { path = "crates/glidex-api", version = "0.0.10-dev" }
glidex-auth = { git = "https://github.com/CMKL-APEX/glidex-commons", tag = "v0.1.1", version = "0.1.1" }
glidex-hv-client = { path = "crates/glidex-hv-client", version = "0.0.10-dev" }
glidex-raftstore = { git = "https://github.com/CMKL-APEX/glidex-commons", tag = "v0.1.1", version = "0.1.1" }
glidex-tls = { git = "https://github.com/CMKL-APEX/glidex-commons", tag = "v0.1.1", version = "0.1.1" }
glidex-trust = { git = "https://github.com/CMKL-APEX/glidex-commons", tag = "v0.1.1", version = "0.1.1" }
glidex-topology = { git = "https://github.com/CMKL-APEX/glidex-commons", tag = "v0.1.1", version = "0.1.1" }
glidex-authd = { git = "https://github.com/CMKL-APEX/glidex-commons", tag = "v0.1.1" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4", "v5"] }
thiserror = "2"
axum = "0.8"
reqwest = { version = "0.13", features = ["json", "form"] }
tracing = "0.1"
