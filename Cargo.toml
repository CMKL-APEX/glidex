[workspace]
members = [
    "crates/glidex-api",
    "crates/glidex-control-plane",
    "crates/glidex-ovs",
    "crates/glidex-ovn",
    "crates/glidex-install",
    "crates/glidex-netd",
    "crates/glidex-stord",
    "crates/glidex-authd",
    "crates/glidex-ui",
    "crates/glidex-hv-client",
    "crates/glidex-vm-shim",
    "crates/glidex-tls",
    "crates/glidex-e2e",
    "crates/glidex-raftstore",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4", "v5"] }
thiserror = "1"
axum = "0.8"
reqwest = { version = "0.12", features = ["json"] }
tracing = "0.1"
